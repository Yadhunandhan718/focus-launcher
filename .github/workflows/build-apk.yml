name: Build APK

# Runs on every push, and you can also start it by hand from the Actions tab.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Pinned so a future "ubuntu-latest" change can't break the build.
    # This image already ships with the Android SDK and accepted licenses.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Uses Gradle 8.9 directly, so no gradlew wrapper script is needed.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      # Debug builds are signed automatically, so this APK installs straight onto a phone.
      - uses: actions/upload-artifact@v4
        with:
          name: focus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
